name: Front v2

# frontend_v2.md, seccion 10: cuando cambia `frontends/**` o una API que
# consume /v2/, CI corre npm ci, lint, typecheck, test, build y el chequeo de
# contrato.
#
# El chequeo de contrato son dos mitades:
#   1. el schema versionado coincide con el que genera el back (necesita Django);
#   2. los tipos TS coinciden con el schema (solo Node).

permissions:
    contents: read

on:
    pull_request:
        branches:
            - development
            - homologacion
            - main
        paths:
            - "frontends/**"
            - "celiaquia/api_urls.py"
            - "celiaquia/api_views.py"
            - "celiaquia/api_serializers.py"
            - "config/urls_frontend_v2.py"
            - ".github/workflows/frontend_v2.yml"
    push:
        branches:
            - development
            - homologacion
            - main
        paths:
            - "frontends/**"
            - "celiaquia/api_urls.py"
            - "celiaquia/api_views.py"
            - "celiaquia/api_serializers.py"
            - "config/urls_frontend_v2.py"
            - ".github/workflows/frontend_v2.yml"

jobs:
    front:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontends

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: frontends/.nvmrc
                  cache: npm
                  cache-dependency-path: frontends/package-lock.json

            - name: Instalar dependencias
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Contrato - los tipos coinciden con el schema
              run: npm run api:check

    contrato_back:
        # La otra mitad del chequeo: que `openapi.yaml` sea el que genera el
        # back hoy. Si alguien toca un serializer y no regenera, falla aca.
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Instalar dependencias
              run: pip install -r requirements.txt

            - name: Create .env for CI
              run: |
                  cat > .env <<'EOF'
                  DJANGO_DEBUG=False
                  DJANGO_SECRET_KEY=ci-secret-key-no-usar-en-produccion
                  DJANGO_ALLOWED_HOSTS="localhost,127.0.0.1"
                  DATABASE_ENGINE=django.db.backends.sqlite3
                  DATABASE_NAME=:memory:
                  EOF

            - name: Regenerar el schema
              run: |
                  python manage.py spectacular \
                    --urlconf config.urls_frontend_v2 \
                    --file /tmp/openapi.yaml

            - name: El schema versionado esta al dia
              run: |
                  if ! diff -u frontends/packages/api/openapi.yaml /tmp/openapi.yaml; then
                    echo ""
                    echo "El contrato versionado quedo viejo. Regeneralo:"
                    echo "  docker compose exec django python manage.py spectacular \\"
                    echo "    --urlconf config.urls_frontend_v2 \\"
                    echo "    --file frontends/packages/api/openapi.yaml"
                    echo "  npm run api:types --prefix frontends"
                    exit 1
                  fi
