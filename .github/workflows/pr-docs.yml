name: Documentacion automatica de PR

permissions:
    contents: read
    pull-requests: read

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - edited
        branches:
            - development
            - homologacion
            - main

concurrency:
    group: pr-docs-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    generate_pr_artifacts:
        # El commit de artefactos vuelve a disparar este workflow: no regenerar
        # cuando el push lo hizo la automatizacion.
        if: github.event.sender.login != 'github-actions[bot]' && github.event.sender.login != 'secretarianaf-sisoc-release[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'development' && github.event.pull_request.head.ref != 'homologacion' && github.event.pull_request.head.ref != 'main'
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest

        steps:
            # Un push con GITHUB_TOKEN deja los workflows del commit nuevo en
            # action_required y el PR bloqueado; el de la GitHub App los corre.
            - name: Generar token temporal de GitHub App
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

            - name: Checkout branch del PR
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Set up Python
              uses: actions/setup-python@v6.2.0
              with:
                  python-version: "3.11.15"

            - name: Generar artefactos spec-as-source
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_EVENT_PATH: ${{ github.event_path }}
              run: python src/scripts/ci/pr_doc_automation.py

            - name: Commit automatico de artefactos
              env:
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  changes="$(git status --porcelain --untracked-files=all -- docs/registro/prs docs/registro/releases/pending CHANGELOG.md)"
                  if [ -z "$changes" ]; then
                    echo "No hay cambios generados para commitear."
                    exit 0
                  fi

                  git config user.name "secretarianaf-sisoc-release[bot]"
                  git config user.email "332544933+secretarianaf-sisoc-release[bot]@users.noreply.github.com"

                  git add docs/registro/prs docs/registro/releases/pending CHANGELOG.md
                  git commit -m "docs(ci): actualizar artefactos automaticos del PR #${{ github.event.pull_request.number }}"

                  for attempt in 1 2 3; do
                    if git push origin "HEAD:${PR_HEAD_REF}"; then
                      exit 0
                    fi
                    if [ "$attempt" -eq 3 ]; then
                      break
                    fi

                    echo "La rama avanzo durante la generacion; reintentando sobre el HEAD remoto (intento $attempt/3)."
                    git fetch --no-tags origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
                    if ! git rebase "refs/remotes/origin/${PR_HEAD_REF}"; then
                      git rebase --abort
                      echo "No fue posible rebasar los artefactos automaticos sin conflictos."
                      exit 1
                    fi
                  done

                  echo "No fue posible publicar los artefactos automaticos tras 3 intentos."
                  exit 1

    sync_pr_artifacts:
        needs: generate_pr_artifacts
        # Las ramas protegidas no se autoescriben, pero deben traer sus
        # artefactos ya generados para que una promoción no saltee el gate.
        if: always()
        runs-on: ubuntu-latest

        steps:
            - name: Checkout base confiable del PR
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0

            - name: Verificar artefactos spec-as-source en la rama origen
              run: |
                  if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
                    git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/pr-head"
                  else
                    git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
                  fi

                  paths="$(git ls-tree -r --name-only refs/remotes/origin/pr-head -- docs/registro/prs docs/registro/releases/pending CHANGELOG.md)"
                  # El registro vive en la carpeta del trimestre: docs/registro/prs/AAAA-TN/PR-N.md.
                  record_pattern="^docs/registro/prs/[0-9]{4}-T[1-4]/PR-${{ github.event.pull_request.number }}\\.md$"
                  missing=()

                  if ! grep -Eq "$record_pattern" <<< "$paths"; then
                    missing+=("docs/registro/prs/AAAA-TN/PR-${{ github.event.pull_request.number }}.md")
                  fi
                  if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
                    release_pattern="^docs/registro/releases/pending/.*-pr-${{ github.event.pull_request.number }}\\.md$"
                    if ! grep -Eq "$release_pattern" <<< "$paths"; then
                      missing+=("docs/registro/releases/pending/*-pr-${{ github.event.pull_request.number }}.md")
                    fi
                    if ! grep -Fxq "CHANGELOG.md" <<< "$paths"; then
                      missing+=("CHANGELOG.md")
                    fi
                  fi

                  if [ "${#missing[@]}" -eq 0 ]; then
                    echo "Artefactos spec-as-source presentes en la rama origen."
                    exit 0
                  fi

                  protected_source=false
                  if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && \
                    { [ "${{ github.event.pull_request.head.ref }}" = "development" ] || \
                      [ "${{ github.event.pull_request.head.ref }}" = "homologacion" ] || \
                      [ "${{ github.event.pull_request.head.ref }}" = "main" ]; }; then
                    protected_source=true
                  fi

                  {
                    if [ "$protected_source" = true ]; then
                      echo "### Advertencia: artefactos spec-as-source pendientes"
                    else
                      echo "### Artefactos spec-as-source pendientes"
                    fi
                    echo ""
                    echo "Faltan los siguientes paths en la rama origen:"
                    echo '```text'
                    printf '%s\n' "${missing[@]}"
                    echo '```'
                    echo "Regenerá y commiteá los artefactos con \`python src/scripts/ci/pr_doc_automation.py --repository ${{ github.repository }} --pr ${{ github.event.pull_request.number }}\`."
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$protected_source" = true ]; then
                    echo "La rama origen está protegida; los artefactos faltantes no bloquean esta promoción."
                    exit 0
                  fi

                  echo "Faltan artefactos spec-as-source requeridos para mergear."
                  exit 1
