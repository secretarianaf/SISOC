services:
  django:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - .:/sisoc/
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen, Request; r = urlopen(Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=2); exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10m
      retries: 12

  front_vpsl:
    image: ${VPSL_IMAGE_TAG:-sisoc/front-vpsl:local}
    build:
      context: ./frontends
      dockerfile: Dockerfile
      target: prod
      args:
        APP: vpsl
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
        VITE_RELEASE_SHA: ${VITE_RELEASE_SHA:-local}
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: ocr_worker
    volumes:
      - .:/sisoc/
    restart: unless-stopped
