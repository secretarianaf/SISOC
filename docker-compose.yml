services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      DOCKER_MYSQL_PORT: ${DOCKER_MYSQL_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/local-dump.sql:/docker-entrypoint-initdb.d/local-dump.sql
    ports:
      - ${DOCKER_MYSQL_PORT_FORWARD}:${DOCKER_MYSQL_PORT}
    expose:
      - ${DOCKER_MYSQL_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "${DOCKER_MYSQL_PORT}"]
      interval: 10s
      timeout: 10s
      retries: 5

  django:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      # Desarrollo: core + backends en un solo proceso (src/backends/config/settings_all.py).
      DJANGO_SETTINGS_MODULE: config.settings_all
    env_file:
      - .env
    ports:
      - ${DOCKER_DJANGO_PORT_FORWARD}:${DOCKER_DJANGO_PORT}
      - ${DOCKER_DEBUGGER_PORT_FORWARD}:${DOCKER_DEBUGGER_PORT}
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: "no"
    # El front v2 espera a que Django este sano antes de levantar.
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen, Request; r = urlopen(Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=2); exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      # En CI el primer arranque (migrate + load_fixtures sobre MySQL vacio)
      # ya tarda 5-7 min; con 5m el check cortaba justo en el limite.
      start_period: 10m
      retries: 12

  front_vpsl:
    image: ${VPSL_IMAGE_TAG:-sisoc/front-vpsl:local}
    build:
      context: .
      dockerfile: docker/frontends/Dockerfile
      target: prod
      args:
        APP: vpsl
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-dev}
        VITE_RELEASE_SHA: ${VITE_RELEASE_SHA:-local}
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  # Front v2 de Celiaquia. Sin puerto publicado: solo lo alcanza Django por la
  # red de compose (FRONTEND_V2_UPSTREAMS en src/backends/config/settings.py).
  front_celiaquia:
    image: sisoc/front-celiaquia:local
    build:
      context: .
      dockerfile: docker/frontends/Dockerfile
      target: prod
      args:
        APP: celiaquia
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-dev}
        VITE_RELEASE_SHA: ${VITE_RELEASE_SHA:-local}
    # Reiniciar el front no reinicia django, y viceversa (frontend_v2.md, 9).
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      # Desarrollo: core + backends en un solo proceso (src/backends/config/settings_all.py).
      DJANGO_SETTINGS_MODULE: config.settings_all
      DJANGO_SERVICE_ROLE: ocr_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  encuestas_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      # Desarrollo: core + backends en un solo proceso (src/backends/config/settings_all.py).
      DJANGO_SETTINGS_MODULE: config.settings_all
      DJANGO_SERVICE_ROLE: encuestas_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
