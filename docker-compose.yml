services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      DOCKER_MYSQL_PORT: ${DOCKER_MYSQL_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/local-dump.sql:/docker-entrypoint-initdb.d/local-dump.sql
    ports:
      - ${DOCKER_MYSQL_PORT_FORWARD}:${DOCKER_MYSQL_PORT}
    expose:
      - ${DOCKER_MYSQL_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "${DOCKER_MYSQL_PORT}"]
      interval: 10s
      timeout: 10s
      retries: 5

  django:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
    env_file:
      - .env
    ports:
      - ${DOCKER_DJANGO_PORT_FORWARD}:${DOCKER_DJANGO_PORT}
      - ${DOCKER_DEBUGGER_PORT_FORWARD}:${DOCKER_DEBUGGER_PORT}
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 5m
      retries: 12

  front_vpsl:
    image: ${VPSL_IMAGE_TAG:-sisoc/front-vpsl:local}
    build:
      context: ./frontends
      dockerfile: Dockerfile
      target: prod
      args:
        APP: vpsl
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-dev}
        VITE_RELEASE_SHA: ${VITE_RELEASE_SHA:-local}
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: ocr_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  encuestas_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: encuestas_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
