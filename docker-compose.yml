services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      DOCKER_MYSQL_PORT: ${DOCKER_MYSQL_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/local-dump.sql:/docker-entrypoint-initdb.d/local-dump.sql
    ports:
      - ${DOCKER_MYSQL_PORT_FORWARD}:${DOCKER_MYSQL_PORT}
    expose:
      - ${DOCKER_MYSQL_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "${DOCKER_MYSQL_PORT}"]
      interval: 10s
      timeout: 10s
      retries: 5

  django:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      # Allowlist del router /v2/: que modulos puede reenviar Django y adonde.
      # Va aca y no en .env para que /v2/ funcione sin configuracion previa.
      FRONTEND_V2_SERVICIOS: ${FRONTEND_V2_SERVICIOS:-celiaquia=http://front_celiaquia:8080/}
    env_file:
      - .env
    ports:
      - ${DOCKER_DJANGO_PORT_FORWARD}:${DOCKER_DJANGO_PORT}
      - ${DOCKER_DEBUGGER_PORT_FORWARD}:${DOCKER_DEBUGGER_PORT}
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    # El front v2 espera a que Django este sano antes de levantar.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://localhost:${DOCKER_DJANGO_PORT}/health/', timeout=5
          ).status == 200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: "no"

  # Front v2 del modulo. Puerto interno: no se expone al host, solo lo alcanza
  # Django por la red de compose (FRONTEND_V2_SERVICIOS).
  front_celiaquia:
    build:
      context: ./frontends
      dockerfile: Dockerfile
      target: ${FRONT_TARGET:-prod}
      args:
        APP: celiaquia
    image: sisoc-front-celiaquia
    expose:
      - "8080"
    # Reiniciar el front no reinicia django, y viceversa (frontend_v2.md, 9).
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: ocr_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  encuestas_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: encuestas_worker
    env_file:
      - .env
    volumes:
      - .:/sisoc/
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
