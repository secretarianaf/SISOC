services:
  redis:
    image: redis:7.4.8-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - pas_redis:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_pas_worker:
    # Worker de PAS: imagen y settings del backend de PAS
    # (src/backends/config/backends.json).
    image: sisoc/backend-pas:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      target: backend
      args:
        BACKEND: pas
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: pas_runtime.settings
    volumes: ["./media:/sisoc/media", "./logs:/sisoc/logs"]
    command: [celery, -A, config.celery:app, worker, -Q, pas, --concurrency=1, --loglevel=INFO, --hostname=pas@%h]
    restart: unless-stopped
    stop_grace_period: 6m
    healthcheck:
      test: [CMD-SHELL, 'celery -A config.celery:app inspect ping --destination "pas@$$HOSTNAME" --timeout 10']
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  celery_comedores_worker:
    # Tareas del backend de comedores (PDF consolidado de rendiciones, #2845):
    # imagen y settings de comedores, cola propia para no competir con PAS.
    image: sisoc/backend-comedores:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      target: backend
      args:
        BACKEND: comedores
    env_file: [.env]
    environment:
      TZ: America/Argentina/Buenos_Aires
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: comedores_runtime.settings
    volumes: ["./media:/sisoc/media", "./logs:/sisoc/logs"]
    command: [celery, -A, config.celery:app, worker, -Q, comedores, --concurrency=2, --loglevel=INFO, --hostname=comedores@%h]
    restart: unless-stopped
    stop_grace_period: 6m
    healthcheck:
      test: [CMD-SHELL, 'celery -A config.celery:app inspect ping --destination "comedores@$$HOSTNAME" --timeout 10']
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    # Beat corre con la imagen de PAS; las tareas periódicas de otros backends
    # se envían por nombre a su cola (src/backends/config/celery.py).
    image: sisoc/backend-pas:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      target: backend
      args:
        BACKEND: pas
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: pas_runtime.settings
    volumes:
      - ./logs:/sisoc/logs
      - pas_beat:/beat
    command: [celery, -A, config.celery:app, beat, --loglevel=INFO, --schedule=/beat/schedule]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pas_redis:
  pas_beat:
