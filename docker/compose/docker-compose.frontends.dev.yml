services:
  django:
    environment:
      FRONT_VPSL_ORIGIN: http://front_vpsl:5173
      FRONTEND_V2_HMR_ORIGINS: http://localhost:5173,ws://localhost:5173
  front_vpsl:
    build:
      target: dev
    command: ["sh", "-c", "npm ci && npm run dev -w @sisoc/vpsl -- --host 0.0.0.0"]
    volumes:
      - ./src/frontends:/app
      - front_vpsl_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  front_vpsl_node_modules:
