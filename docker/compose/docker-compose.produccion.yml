# Workers de HML/PRD: imagen del dueño; datos y migrador compartidos.
services:
  django:
    healthcheck:
      start_period: 20m

  bulk_credentials_worker:
    image: sisoc/core:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
      target: core
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: bulk_credentials_worker
    volumes:
      - ./media:/sisoc/media
      - ./logs:/sisoc/logs
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: unless-stopped

  ciudadanos_import_worker:
    scale: 2
    image: sisoc/core:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
      target: core
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: ciudadanos_import_worker
    volumes:
      - ./media:/sisoc/media
      - ./logs:/sisoc/logs
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: unless-stopped

  mailing_worker:
    image: sisoc/backend-comedores:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
      target: backend
      args:
        BACKEND: comedores
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: mailing_worker
      DJANGO_SETTINGS_MODULE: comedores_runtime.settings
    command: ["python", "./docker/django/entrypoint.py"]
    volumes:
      - ./media:/sisoc/media
      - ./logs:/sisoc/logs
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: unless-stopped

  user_import_worker:
    image: sisoc/migrator:${SISOC_RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile
      target: migrator
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SERVICE_ROLE: user_import_worker
      DJANGO_SETTINGS_MODULE: config.settings_all
      SISOC_PREPARAR_DB: "false"
    volumes:
      - ./media:/sisoc/media
      - ./logs:/sisoc/logs
    user: "${RUN_UID:-0}:${RUN_GID:-0}"
    restart: unless-stopped
