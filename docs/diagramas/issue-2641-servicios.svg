<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1640" viewBox="0 0 1600 1640" role="img" aria-labelledby="title desc">
<title id="title">Servicios SISOC después de #2641</title>
<desc id="desc">Portal de entrada, diez backends propios, frontends React, workers y migrador. MySQL, sesión y archivos siguen compartidos. Kernel se empaqueta en cada imagen Django. Es una arquitectura validada localmente, sin afirmar despliegue.</desc>
