# Referencia HML basada en produccion. NO activar sin comparar en hml-old.
# Rutas, certificados, logs, upstream, zonas y PWA copian PRD y requieren verificacion.
# Alias observed in hml-old; preserve canonical redirect.
server {
    listen 80;
    server_name com.hml-sisoc.secretarianaf.gob.ar;
    return 301 https://hml-sisoc.secretarianaf.gob.ar$request_uri;
}
server {
    listen 443 ssl http2;
    server_name com.hml-sisoc.secretarianaf.gob.ar;
    ssl_certificate /etc/apache2/certs/fullchain.crt;
    ssl_certificate_key /etc/apache2/certs/secretarianaf.gob.ar.key;
    return 301 https://hml-sisoc.secretarianaf.gob.ar$request_uri;
}

server {
    listen 80;
    server_name hml-sisoc.secretarianaf.gob.ar;
    return 301 https://hml-sisoc.secretarianaf.gob.ar$request_uri;
}

  server {
      listen 443 ssl http2;
      server_name hml-sisoc.secretarianaf.gob.ar;

      ssl_certificate     /etc/apache2/certs/fullchain.crt;
      ssl_certificate_key /etc/apache2/certs/secretarianaf.gob.ar.key;

      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"
  always;

      client_max_body_size 500M;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      location /static/ {
          alias /sisoc/SISOC/static_root/;
          add_header X-Frame-Options SAMEORIGIN;
          add_header X-Content-Type-Options nosniff;
          add_header X-XSS-Protection "1; mode=block";
      }

      location /media/ {
          alias /sisoc/SISOC/media/;
          add_header X-Frame-Options SAMEORIGIN;
          add_header X-Content-Type-Options nosniff;
          add_header X-XSS-Protection "1; mode=block";
      }

      # Evidencia de Inspecciones escolares: solo por la API, con los permisos del acta.
      location ^~ /media/inspecciones/ {
          return 404;
      }

      # Private documents must be served through authorized application views.
      # XLSX originales CDF: acceso solo por descarga autenticada del lote.
      location ^~ /media/centrodefamilia/cargas_masivas/ {
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          return 404;
      }
      location ^~ /media/pas/ddjj/ { return 404; }
      # Mantener la regla existente; requiere remediacion CDI previa por entorno.
      location ^~ /media/cdi/ { return 404; }
      location ^~ /media/adjuntos/ { return 404; }

      # MID routes observed in hml-old, versioned here instead of an external include.
      location = /MID {
          return 301 /MID/$is_args$args;
      }
      location ^~ /MID/ {
          proxy_pass http://127.0.0.1:8100/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
          proxy_read_timeout 180s;
          proxy_send_timeout 180s;
          client_max_body_size 100m;
      }

      include /etc/nginx/snippets/sisoc-pwas.conf;

      location ^~ /admin/ {
          limit_req zone=default burst=40 nodelay;

          proxy_pass         http://localhost:8001;
          proxy_http_version 1.1;

          proxy_set_header   Host               $host;
          proxy_set_header   X-Real-IP          $remote_addr;
          proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto  $scheme;
          proxy_set_header   X-Forwarded-Host   $host;
          proxy_set_header   X-Forwarded-Port   443;

          proxy_set_header   Authorization      $http_authorization;
          proxy_pass_header  Authorization;
          proxy_set_header   Cookie             $http_cookie;
          proxy_redirect off;
      }

      location / {
          limit_req zone=default burst=40 nodelay;

          proxy_pass         http://localhost:8001;
          proxy_http_version 1.1;

          proxy_set_header   Host               $host;
          proxy_set_header   X-Real-IP          $remote_addr;
          proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto  $scheme;
          proxy_set_header   X-Forwarded-Host   $host;
          proxy_set_header   X-Forwarded-Port   443;

          proxy_set_header   Authorization      $http_authorization;
          proxy_pass_header  Authorization;
          proxy_set_header   Cookie             $http_cookie;
          proxy_redirect off;
      }

      access_log  /sisoc/logs/nginx/SISOC-ssl-access.log;
      error_log   /sisoc/logs/nginx/SISOC-ssl-error.log;
  }

