# Referencia QA: comparar con el vhost efectivo antes de cualquier activacion.
server {
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    listen 80 default_server;

    error_log  /var/log/nginx/staging-sisoc-error.log;
    access_log /var/log/nginx/staging-sisoc-access.log combined;

    location /static/ {
        alias /home/admin-ssies/sisoc-comedores-test/BACKOFFICE/static_root/;
    }
    location /media/ {
        alias /home/admin-ssies/sisoc-comedores-test/BACKOFFICE/media/;
    }
    # Proteger adjuntos CDF e Inspecciones; verificar antes de activar por entorno.
    location ^~ /media/centrodefamilia/cargas_masivas/ { return 404; }
    location ^~ /media/inspecciones/ { return 404; }
    include /etc/nginx/snippets/sisoc-pwas.conf;

    location / {
        proxy_pass         http://localhost:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }
}
