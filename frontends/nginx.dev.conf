# nginx para ver el front v2 directo, sin pasar por Django (solo desarrollo).
#
# La imagen de produccion sirve el build en la raiz, pero Vite lo compila con
# `base: "/v2/celiaquia/"`, asi que el index.html pide sus assets en esa ruta.
# Entrando por la raiz el HTML carga y el JS da 404. Por eso aca se publica la
# app en la misma ruta con la que fue construida.
#
# Ademas se proxea `/api/` a Django: el front pide `/api/celiaquia/` en su mismo
# origen (asi usa la sesion sin tokens). Sin este proxy la UI se ve pero no trae
# ningun dato.
#
# Lo monta docker-compose.override.yml, que no se versiona.
server {
    listen 8080;
    server_name localhost;

    # La API y el login viven en Django. Las cookies no distinguen puerto, asi
    # que una sesion abierta en :8001 tambien vale para :8080.
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El SPA. `try_files` manda cualquier ruta del router al index, para que los
    # deep links no den 404.
    location /v2/celiaquia/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /v2/celiaquia/index.html;
    }

    # Comodidad: entrar por la raiz lleva a la app.
    location = / {
        return 302 /v2/celiaquia/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
