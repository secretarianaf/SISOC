components:
  schemas:
    AccionEnum:
      enum:
      - APROBAR
      - RECHAZAR
      - SUBSANAR
      - ELIMINAR
      type: string
      description: |-
        * `APROBAR` - APROBAR
        * `RECHAZAR` - RECHAZAR
        * `SUBSANAR` - SUBSANAR
        * `ELIMINAR` - ELIMINAR
    AccionResultado:
      type: object
      description: Respuesta uniforme de las acciones que delegan en un service.
      properties:
        detail:
          type: string
        expediente:
          $ref: '#/components/schemas/Expediente'
      required:
      - detail
    ActualizarRegistroErroneo:
      type: object
      description: |-
        Correccion de una fila que quedo con error en la importacion.

        Las claves dependen del Excel, asi que se acepta el diccionario entero y la
        validacion real la hace `registros_erroneos_service`, que es el mismo camino
        que usa la pantalla.
      properties:
        datos:
          type: object
          additionalProperties:
            type: string
      required:
      - datos
    Archivo:
      type: object
      description: Subida generica de un archivo (cruce, respuesta de Sintys).
      properties:
        archivo:
          type: string
          format: uri
      required:
      - archivo
    AsignacionTecnico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tecnico:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        fecha_asignacion:
          type: string
          format: date-time
          readOnly: true
        activa:
          type: boolean
          description: Indica si la asignación está activa
      required:
      - fecha_asignacion
      - id
      - tecnico
    AsignarTecnico:
      type: object
      properties:
        tecnico_id:
          type: integer
      required:
      - tecnico_id
    BlankEnum:
      enum:
      - ''
    CatalogosRegistroErroneo:
      type: object
      description: Catálogos chicos que el formulario necesita enteros.
      properties:
        sexos:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
        nacionalidades:
          type: array
          items:
            $ref: '#/components/schemas/OpcionCatalogo'
      required:
      - nacionalidades
      - sexos
    ComentarioLegajo:
      type: object
      description: |-
        Comentario del panel de un legajo.

        Los comentarios tecnicos estructurados (issue #2318) traen ademas tipo de
        documento y observacion; en el resto esos campos vienen vacios.
      properties:
        id:
          type: integer
          readOnly: true
        comentario:
          type: string
        usuario:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        es_interno:
          type: boolean
          description: 'Comentario interno: visible solo para usuarios de Nación'
        es_comentario_tecnico:
          type: boolean
          readOnly: true
        tipo_comentario:
          $ref: '#/components/schemas/TipoComentarioEnum'
        tipo_documento:
          nullable: true
          description: |-
            Tipo de documento revisado (solo en comentarios técnicos)

            * `RENAPER` - RENAPER
            * `ANSES` - ANSES
            * `CONDICION_DIAGNOSTICA` - Condición diagnóstica
          oneOf:
          - $ref: '#/components/schemas/TipoDocumentoEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        tipo_documento_display:
          type: string
          readOnly: true
        archivo_url:
          type: string
          readOnly: true
      required:
      - archivo_url
      - comentario
      - es_comentario_tecnico
      - fecha_creacion
      - id
      - tipo_comentario
      - tipo_documento_display
      - usuario
    ConfigurarCupo:
      type: object
      description: |-
        Base de los serializers de solo entrada: no persisten nada.

        Las escrituras de este modulo pasan siempre por `celiaquia/services/`, asi
        que `create`/`update` no deben existir. Se centraliza el rechazo para no
        repetirlo en cada serializer.
      properties:
        total_asignado:
          type: integer
          minimum: 0
      required:
      - total_asignado
    CrearComentarioTecnico:
      type: object
      description: |-
        Alta estructurada: tipo de documento + Si/No + observacion.

        La combinacion valida la decide `ComentariosTecnicosService.registrar`, que
        es el mismo camino que usa la pantalla.
      properties:
        tipo_documento:
          type: string
        tiene_observaciones:
          type: string
        observacion_codigo:
          type: string
          nullable: true
        observacion_libre:
          type: string
      required:
      - tiene_observaciones
      - tipo_documento
    CrearLegajos:
      type: object
      description: Alta manual de legajos desde las filas previsualizadas.
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - rows
    CrearPago:
      type: object
      description: |-
        Base de los serializers de solo entrada: no persisten nada.

        Las escrituras de este modulo pasan siempre por `celiaquia/services/`, asi
        que `create`/`update` no deben existir. Se centraliza el rechazo para no
        repetirlo en cada serializer.
      properties:
        provincia_id:
          type: integer
        periodo:
          type: string
          maxLength: 7
      required:
      - provincia_id
    CupoMovimiento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provincia:
          type: string
          readOnly: true
        expediente_id:
          type: integer
          nullable: true
          readOnly: true
        legajo_id:
          type: integer
          nullable: true
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        delta:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        motivo:
          type: string
          maxLength: 255
        usuario:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado_en
      - delta
      - expediente_id
      - id
      - legajo_id
      - provincia
      - tipo
      - usuario
    DocumentoLegajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legajo_id:
          type: integer
          readOnly: true
        tipo_documento:
          type: string
          readOnly: true
        archivo_url:
          type: string
          description: URL absoluta del archivo; nunca la ruta de almacenamiento.
          readOnly: true
        observaciones:
          type: string
        usuario_carga:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        fecha_carga:
          type: string
          format: date-time
          readOnly: true
      required:
      - archivo_url
      - fecha_carga
      - id
      - legajo_id
      - tipo_documento
      - usuario_carga
    EstadoCupoEnum:
      enum:
      - NO_EVAL
      - DENTRO
      - FUERA
      type: string
      description: |-
        * `NO_EVAL` - No evaluado
        * `DENTRO` - Dentro de cupo
        * `FUERA` - Fuera de cupo
    EstadoExpediente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 50
      required:
      - id
      - nombre
    EstadoLegajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 50
      required:
      - id
      - nombre
    Expediente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero_expediente:
          type: string
          nullable: true
          maxLength: 100
        estado:
          type: string
          readOnly: true
        provincia:
          type: string
          description: |-
            Provincia derivada del perfil de quien creo el expediente.

            El listado web la deriva de los ciudadanos con un Subquery; aca se usa
            el valor anotado cuando el ViewSet lo provee y se cae al perfil.
          readOnly: true
        usuario_provincia:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        observaciones:
          type: string
          nullable: true
        legajos_total:
          type: integer
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_modificacion:
          type: string
          format: date-time
          readOnly: true
        fecha_cierre:
          type: string
          format: date-time
          nullable: true
      required:
      - estado
      - fecha_creacion
      - fecha_modificacion
      - id
      - legajos_total
      - provincia
      - usuario_provincia
    ExpedienteCreate:
      type: object
      description: Alta del expediente con su Excel masivo.
      properties:
        numero_expediente:
          type: string
          maxLength: 100
        observaciones:
          type: string
        excel_masivo:
          type: string
          format: uri
    ExpedienteEstadoHistorial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        estado:
          type: string
          readOnly: true
        usuario:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - estado
      - fecha
      - id
      - usuario
    GuardarValidacionRenaper:
      type: object
      description: Resultado que el tecnico elige tras ver la comparacion con RENAPER.
      properties:
        estado:
          $ref: '#/components/schemas/GuardarValidacionRenaperEstadoEnum'
        comentario:
          type: string
      required:
      - estado
    GuardarValidacionRenaperEstadoEnum:
      enum:
      - '1'
      - '2'
      - '3'
      type: string
      description: |-
        * `1` - 1
        * `2` - 2
        * `3` - 3
    ImportacionResultado:
      type: object
      description: Resultado de importar los legajos del Excel masivo ya cargado.
      properties:
        validos:
          type: integer
        errores:
          type: integer
        detalles_errores:
          type: array
          items:
            type: object
            additionalProperties: {}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - errores
      - validos
    Legajo:
      type: object
      description: '`ExpedienteCiudadano` es el legajo de una persona dentro del expediente.'
      properties:
        id:
          type: integer
          readOnly: true
        expediente_id:
          type: integer
          readOnly: true
        ciudadano_id:
          type: integer
          readOnly: true
        ciudadano:
          type: string
          readOnly: true
        documento:
          type: string
          readOnly: true
        estado:
          type: string
          readOnly: true
        rol:
          $ref: '#/components/schemas/RolEnum'
        archivos_ok:
          type: boolean
        cruce_ok:
          type: boolean
          nullable: true
        observacion_cruce:
          type: string
          nullable: true
          maxLength: 255
        revision_tecnico:
          $ref: '#/components/schemas/RevisionTecnicoEnum'
        resultado_sintys:
          $ref: '#/components/schemas/ResultadoSintysEnum'
        estado_cupo:
          $ref: '#/components/schemas/EstadoCupoEnum'
        es_titular_activo:
          type: boolean
        estado_validacion_renaper:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 0=no validado, 1=aceptado, 2=rechazado, 3=subsanar
        subsanacion_tipo:
          type: string
          nullable: true
          maxLength: 50
        subsanacion_motivo:
          type: string
          nullable: true
        subsanacion_solicitada_en:
          type: string
          format: date-time
          nullable: true
        subsanacion_enviada_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        modificado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - ciudadano
      - ciudadano_id
      - creado_en
      - documento
      - estado
      - expediente_id
      - id
      - modificado_en
    LocalidadLookup:
      type: object
      description: Localidad con su municipio y provincia, para los selectores del
        alta.
      properties:
        localidad_id:
          type: integer
          readOnly: true
        localidad_nombre:
          type: string
          readOnly: true
        municipio_id:
          type: integer
          readOnly: true
        municipio_nombre:
          type: string
          readOnly: true
          default: ''
        provincia_id:
          type: integer
          readOnly: true
        provincia_nombre:
          type: string
          readOnly: true
          default: ''
      required:
      - localidad_id
      - localidad_nombre
      - municipio_id
      - municipio_nombre
      - provincia_id
      - provincia_nombre
    Motivo:
      type: object
      description: Motivo de una baja, suspension o reactivacion de cupo.
      properties:
        motivo:
          type: string
          default: ''
          maxLength: 2000
    MotivoPreview:
      type: object
      description: Motivo que se propondria al subsanar o rechazar, ya concatenado.
      properties:
        lineas:
          type: array
          items:
            type: string
        motivo:
          type: string
      required:
      - lineas
      - motivo
    NullEnum:
      enum:
      - null
    ObservacionSubsanacion:
      type: object
      description: |-
        Base de los serializers de solo entrada: no persisten nada.

        Las escrituras de este modulo pasan siempre por `celiaquia/services/`, asi
        que `create`/`update` no deben existir. Se centraliza el rechazo para no
        repetirlo en cada serializer.
      properties:
        tipo:
          type: string
          maxLength: 50
        detalle:
          type: string
          maxLength: 500
      required:
      - detalle
      - tipo
    OpcionCatalogo:
      type: object
      description: |-
        Opción de un desplegable: id y etiqueta, nada más.

        El formulario de corrección de registros erróneos guarda **ids**, igual que
        la pantalla Django: el Excel trae texto libre ("F", "ARGENTINA") o códigos
        de otro sistema, y por eso falla la importación.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - id
      - nombre
    Organismo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
      required:
      - id
      - nombre
    PaginatedAsignacionTecnicoList:
