          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccionResultado'
          description: ''
  /api/celiaquia/cupos/provincia/{provincia_id}/:
    post:
      operationId: cupos_provincia_create
      description: |-
        Fija el total asignado de una provincia. Crea el cupo si no existia.

        Va por provincia y no por pk del cupo porque la provincia puede todavia
        no tener `ProvinciaCupo`: es justamente el caso de "sin configurar".
      parameters:
      - in: path
        name: provincia_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - cupos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurarCupo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfigurarCupo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfigurarCupo'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinciaCupo'
          description: ''
  /api/celiaquia/estados-expediente/:
    get:
