    PagoExpediente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provincia:
          type: string
          readOnly: true
        periodo:
          type: string
          description: YYYY-MM
          maxLength: 7
        estado:
          $ref: '#/components/schemas/PagoExpedienteEstadoEnum'
        total_candidatos:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        total_validados:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        total_excluidos:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        creado_en:
          type: string
          format: date-time
          readOnly: true
        modificado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado_en
      - id
      - modificado_en
      - periodo
      - provincia
    PagoExpedienteEstadoEnum:
      enum:
      - BORRADOR
      - ENVIADO
      - PROCESADO
      - CERRADO
      type: string
      description: |-
        * `BORRADOR` - Borrador
        * `ENVIADO` - Enviado a Sintys
        * `PROCESADO` - Cruce procesado
        * `CERRADO` - Cerrado
    PagoNomina:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pago_id:
          type: integer
          readOnly: true
        legajo_id:
          type: integer
          readOnly: true
        documento:
          type: string
          maxLength: 16
        nombre:
          type: string
          maxLength: 80
        apellido:
          type: string
          maxLength: 80
        estado:
          $ref: '#/components/schemas/PagoNominaEstadoEnum'
        observacion:
          type: string
          maxLength: 255
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado_en
      - documento
      - id
      - legajo_id
      - pago_id
    PagoNominaEstadoEnum:
      enum:
      - VALIDADO
      - EXCLUIDO
      type: string
      description: |-
        * `VALIDADO` - Validado para pago
        * `EXCLUIDO` - Excluido por cruce
    PatchedExpedienteUpdate:
      type: object
      description: Metadatos editables mientras el expediente esta en CREADO.
      properties:
        numero_expediente:
          type: string
          maxLength: 100
        observaciones:
          type: string
    PreviewExcel:
      type: object
      description: Previsualizacion del Excel antes de crear el expediente.
      properties:
        excel_masivo:
          type: string
          format: uri
        limit:
          type: integer
          maximum: 5000
          minimum: 1
      required:
      - excel_masivo
    PreviewExcelResultado:
      type: object
      description: |-
        Respuesta de `preview-excel/`.

        Sin esto, drf-spectacular documentaba el serializer de **entrada** como si
        fuera la respuesta, y los tipos generados para el front quedaban al reves.

        No se expone `all_rows`, que el servicio devuelve para que la vista web lo
        guarde en sesion: son hasta 5000 filas duplicadas que ningun cliente de la
        API consume.
      properties:
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: {}
        total_rows:
          type: integer
        shown_rows:
          type: integer
      required:
      - headers
      - rows
      - shown_rows
      - total_rows
    ProvinciaCupo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provincia:
          type: string
          readOnly: true
        provincia_id:
          type: integer
          readOnly: true
        total_asignado:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        usados:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        disponibles:
          type: integer
          readOnly: true
      required:
      - disponibles
      - id
      - provincia
      - provincia_id
    RegistroErroneo:
      type: object
      description: |-
        Fila del Excel que no pudo importarse.

        `datos_raw` sale tal cual entro: es lo que el usuario tiene que corregir.
      properties:
        id:
          type: integer
          readOnly: true
        expediente:
          type: integer
        fila_excel:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        datos_raw: {}
        campo_error:
          type: string
          maxLength: 100
        mensaje_error:
          type: string
        procesado:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        procesado_en:
          type: string
          format: date-time
          nullable: true
      required:
      - creado_en
      - datos_raw
      - expediente
      - fila_excel
      - id
      - mensaje_error
    ReprocesoResultado:
      type: object
      description: Resumen de `registros-erroneos/reprocesar`.
      properties:
        creados:
          type: integer
        errores:
          type: integer
        errores_detalle:
          type: array
          items:
            type: string
        excluidos:
          type: integer
        excluidos_detalle:
          type: array
          items:
            type: object
            additionalProperties: {}
        registros_restantes:
          type: integer
        alerta_resumen:
          type: string
      required:
      - alerta_resumen
      - creados
      - errores
      - errores_detalle
      - excluidos
      - excluidos_detalle
      - registros_restantes
    ResponderSubsanacion:
      type: object
      description: 'Respuesta de la provincia: uno o varios archivos como evidencia
        nueva.'
      properties:
        archivos:
          type: array
          items:
            type: string
            format: uri
        descripcion:
          type: string
        observacion_id:
          type: integer
          nullable: true
      required:
      - archivos
    ResultadoSintysEnum:
      enum:
      - SIN_CRUCE
      - MATCH
      - NO_MATCH
      type: string
      description: |-
        * `SIN_CRUCE` - Sin cruce
        * `MATCH` - Matcheado
        * `NO_MATCH` - No matcheado
    RevisarLegajo:
      type: object
      description: |-
        Entrada de la revision tecnica de un legajo.

        `texto_libre` es solo el complemento: el motivo final lo compone el service
        concatenando las observaciones tecnicas del legajo. Lo que mande el cliente
        no es la fuente de verdad.
      properties:
        accion:
          $ref: '#/components/schemas/AccionEnum'
        texto_libre:
          type: string
          maxLength: 2000
        tipo_subsanacion:
          type: string
          maxLength: 50
        observaciones:
          type: array
          items:
            $ref: '#/components/schemas/ObservacionSubsanacion'
      required:
      - accion
    RevisionTecnicoEnum:
      enum:
      - PENDIENTE
      - APROBADO
      - RECHAZADO
      - SUBSANAR
      - SUBSANADO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `APROBADO` - Aprobado por el tecnico
        * `RECHAZADO` - Rechazado por el tecnico
        * `SUBSANAR` - Subsanar
        * `SUBSANADO` - Subsanado
    RolEnum:
      enum:
      - beneficiario
      - responsable
      - beneficiario_y_responsable
      type: string
      description: |-
        * `beneficiario` - Solo Beneficiario
        * `responsable` - Solo Responsable
        * `beneficiario_y_responsable` - Beneficiario y Responsable
    SolicitarSubsanacion:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 2000
      required:
      - motivo
    SubirArchivoLegajo:
      type: object
      description: Documentacion de un legajo. El slot es el campo archivo1/2/3.
      properties:
        archivo:
          type: string
          format: uri
        slot:
          type: integer
          maximum: 3
          minimum: 1
      required:
      - archivo
    Subsanacion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legajo_id:
          type: integer
          readOnly: true
        estado:
          $ref: '#/components/schemas/SubsanacionEstadoEnum'
        motivo_general:
          type: string
          nullable: true
          description: Motivo general/observación libre
        solicitada_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        solicitada_en:
          type: string
          format: date-time
          readOnly: true
        respondida_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumen'
          readOnly: true
        respondida_en:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - legajo_id
      - respondida_por
      - solicitada_en
      - solicitada_por
    SubsanacionEstadoEnum:
      enum:
      - PENDIENTE
      - RESPONDIDA
      type: string
      description: |-
        * `PENDIENTE` - Pendiente de respuesta
        * `RESPONDIDA` - Respondida por la provincia
    TipoComentarioEnum:
      enum:
      - VALIDACION_TECNICA
      - SUBSANACION_MOTIVO
      - SUBSANACION_RESPUESTA
      - RENAPER_VALIDACION
      - OBSERVACION_GENERAL
      - CRUCE_SINTYS
      - PAGO_OBSERVACION
      - COMENTARIO_TECNICO
      type: string
      description: |-
        * `VALIDACION_TECNICA` - Validación Técnica
        * `SUBSANACION_MOTIVO` - Motivo de Subsanación
        * `SUBSANACION_RESPUESTA` - Respuesta de Subsanación
        * `RENAPER_VALIDACION` - Validación RENAPER
        * `OBSERVACION_GENERAL` - Observación General
        * `CRUCE_SINTYS` - Cruce SINTYS
        * `PAGO_OBSERVACION` - Observación de Pago
        * `COMENTARIO_TECNICO` - Comentario Técnico
    TipoCruce:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 50
      required:
      - id
      - nombre
    TipoDocumento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
        requerido:
          type: boolean
        orden:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          description: Orden de presentación
        activo:
          type: boolean
      required:
      - id
      - nombre
    TipoDocumentoEnum:
      enum:
      - RENAPER
      - ANSES
      - CONDICION_DIAGNOSTICA
      type: string
      description: |-
        * `RENAPER` - RENAPER
        * `ANSES` - ANSES
        * `CONDICION_DIAGNOSTICA` - Condición diagnóstica
    TipoEnum:
      enum:
      - ALTA
      - REACTIVACION
      - BAJA
      - AJUSTE
      - SUSPENDIDO
      type: string
      description: |-
        * `ALTA` - Alta
        * `REACTIVACION` - Reactivacion
        * `BAJA` - Baja
        * `AJUSTE` - Ajuste
        * `SUSPENDIDO` - Suspendido
    UsuarioResumen:
      type: object
      description: 'Identidad minima de un usuario: nunca mail, permisos ni credenciales.'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
      required:
      - id
      - nombre
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Usar formato: Api-Key TU_API_KEY'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
