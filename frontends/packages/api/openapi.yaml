openapi: 3.0.3
info:
  title: SISOC API
  version: 1.0.0
  description: API de gestión de comedores, centros de familia y más
paths:
  /api/vpsl/actions/{kind}/{id}/:
    get:
      operationId: actions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePreview'
          description: ''
    post:
      operationId: actions_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - vpsl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActionInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActionInput'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
          description: ''
  /api/vpsl/exports/{kind}/{id}/:
    get:
      operationId: exports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/vpsl/forms/{kind}/{id}/:
    get:
      operationId: forms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSchema'
          description: ''
    post:
      operationId: forms_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - vpsl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VpslFormInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VpslFormInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VpslFormInput'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
          description: ''
  /api/vpsl/itinerarios/:
    get:
      operationId: vpsl_itinerarios_list
      parameters:
      - in: query
        name: estado
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItinerarioPage'
          description: ''
    post:
      operationId: vpsl_itinerarios_create
      parameters:
      - in: query
        name: estado
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - vpsl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItinerarioInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItinerarioInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItinerarioInput'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerario'
          description: ''
  /api/vpsl/itinerarios/{id}/:
    get:
      operationId: vpsl_itinerario_detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerario'
          description: ''
  /api/vpsl/jornadas/{id}/:
    get:
      operationId: jornadas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jornada'
          description: ''
  /api/vpsl/jornadas/{id}/laboratorio/:
    get:
      operationId: jornadas_laboratorio_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratorioPage'
          description: ''
  /api/vpsl/jornadas/{id}/registros/:
    get:
      operationId: jornadas_registros_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroPage'
          description: ''
  /api/vpsl/options/:
    get:
      operationId: options_retrieve
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Options'
          description: ''
  /api/vpsl/renaper/:
    get:
      operationId: renaper_retrieve
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Renaper'
          description: ''
  /api/vpsl/sedes/:
    get:
      operationId: vpsl_sedes
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedePage'
          description: ''
  /api/vpsl/sedes/{id}/:
    get:
      operationId: vpsl_sede_detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sede'
          description: ''
  /api/vpsl/session/:
    get:
      operationId: session_retrieve
      tags:
      - vpsl
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/vpsl/ubicacion/:
    post:
      operationId: ubicacion_create
      tags:
      - vpsl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationInput'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPreview'
          description: ''
components:
  schemas:
    AccionEvaluacionEnum:
      enum:
      - aprobar
      - subsanar
      - rechazar
      type: string
      description: |-
        * `aprobar` - aprobar
        * `subsanar` - subsanar
        * `rechazar` - rechazar
    ActionInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        accion_evaluacion:
          $ref: '#/components/schemas/AccionEvaluacionEnum'
        carta_archivo_estado:
          type: string
        carta_referencia_estado:
          type: string
        subsanacion_observaciones:
          type: string
        casos:
          type: array
          items:
            type: integer
        fecha:
          type: string
          format: date
        responsable:
          type: string
    ActionResult:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        ok:
          type: boolean
        message:
          type: string
        redirect:
          type: string
      required:
      - ok
    Checklist:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        item:
          type: string
        descripcion:
          type: string
        cumple:
          type: boolean
          nullable: true
        observacion:
          type: string
        evidencia_url:
          type: string
        historial:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistHistory'
      required:
      - cumple
      - descripcion
      - evidencia_url
      - historial
      - item
      - observacion
    ChecklistHistory:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        fecha:
          type: string
          format: date-time
        antes:
          type: boolean
          nullable: true
        despues:
          type: boolean
          nullable: true
        observacion:
          type: string
        responsable:
          type: string
      required:
      - antes
      - despues
      - fecha
      - observacion
      - responsable
    ChecklistInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        electricidad_cumple:
          type: string
        electricidad_observacion:
          type: string
        electricidad_evidencia:
          type: string
          format: uri
        viandas_cumple:
          type: string
        viandas_observacion:
          type: string
        viandas_evidencia:
          type: string
          format: uri
        seguridad_cumple:
          type: string
        seguridad_observacion:
          type: string
        seguridad_evidencia:
          type: string
          format: uri
      required:
      - electricidad_cumple
      - seguridad_cumple
      - viandas_cumple
    Choice:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    Cierre:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        id:
          type: integer
        consistente:
          type: boolean
        responsable:
          type: string
        atenciones:
          type: integer
        lentes:
          type: integer
        casos:
          type: integer
        observaciones:
          type: string
        acta_adjunta_url:
          type: string
        historial:
          type: array
          items:
            $ref: '#/components/schemas/CierreHistory'
      required:
      - acta_adjunta_url
      - atenciones
      - casos
      - consistente
      - historial
      - id
      - lentes
      - observaciones
      - responsable
    CierreHistory:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        fecha:
          type: string
          format: date-time
        responsable:
          type: string
        atenciones:
          type: integer
        lentes:
          type: integer
        casos:
          type: integer
        acta_adjunta_url:
          type: string
      required:
      - acta_adjunta_url
      - atenciones
      - casos
      - fecha
      - lentes
      - responsable
    CierreInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        cantidad_atenciones_registradas:
          type: integer
        cantidad_lentes_entregados_dia:
          type: integer
        cantidad_casos_laboratorio_reportados:
          type: integer
        responsable_cierre:
          type: string
        acta_adjunta:
          type: string
          format: uri
        observaciones:
          type: string
      required:
      - cantidad_atenciones_registradas
      - cantidad_casos_laboratorio_reportados
      - cantidad_lentes_entregados_dia
      - responsable_cierre
    DeleteBreakdown:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        modelo_key:
          type: string
        modelo:
          type: string
        cantidad:
          type: integer
        modo:
          $ref: '#/components/schemas/ModoEnum'
        ejemplos:
          type: array
          items:
            type: string
      required:
      - cantidad
      - ejemplos
      - modelo
      - modelo_key
      - modo
    DeletePreview:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        preview:
          $ref: '#/components/schemas/DeleteSummary'
      required:
      - preview
    DeleteSummary:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        operacion:
          $ref: '#/components/schemas/OperacionEnum'
        total_afectados:
          type: integer
        total_baja_logica:
          type: integer
        total_borrado_fisico:
          type: integer
        desglose_por_modelo:
          type: array
          items:
            $ref: '#/components/schemas/DeleteBreakdown'
        ejemplos_por_modelo:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - desglose_por_modelo
      - ejemplos_por_modelo
      - operacion
      - total_afectados
      - total_baja_logica
      - total_borrado_fisico
    FormField:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean
        disabled:
          type: boolean
        help:
          type: string
        value: {}
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        min:
          type: string
        max:
          type: string
        step:
          type: string
        graduacion_opcional:
          type: boolean
        file_url:
          type: string
      required:
      - choices
      - disabled
      - file_url
      - graduacion_opcional
      - help
      - label
      - max
      - min
      - name
      - required
      - step
      - type
      - value
    FormSchema:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        kind:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        back:
          type: string
        instrucciones:
          type: string
      required:
      - back
      - fields
      - instrucciones
      - kind
    Itinerario:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        id:
          type: integer
        codigo:
          type: string
        provincia:
          type: string
        estado:
          type: string
        estado_label:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        referente:
          type: string
        localidades:
          type: string
        observaciones:
          type: string
        referente_telefono:
          type: string
        referente_email:
          type: string
        jornadas_total:
          type: integer
          nullable: true
        jornadas:
          type: array
          items:
            $ref: '#/components/schemas/Jornada'
        carta_archivo_estado:
          type: string
        carta_referencia_estado:
          type: string
        carta_archivo_url:
          type: string
        carta_referencia:
          type: string
        subsanacion_observaciones:
          type: string
        estados_evaluacion:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
      required:
      - codigo
      - estado
      - estado_label
      - fecha_fin
      - fecha_inicio
      - id
      - jornadas_total
      - localidades
      - observaciones
      - provincia
      - referente
      - referente_email
      - referente_telefono
    ItinerarioEditInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        provincia:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        referente_nombre:
          type: string
        referente_apellido:
          type: string
        referente_telefono:
          type: string
        referente_email:
          type: string
        carta_archivo:
          type: string
          format: uri
        observaciones:
          type: string
      required:
      - fecha_fin
      - fecha_inicio
      - provincia
      - referente_nombre
    ItinerarioInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        provincia:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        referente_nombre:
          type: string
        referente_apellido:
          type: string
        referente_telefono:
          type: string
        referente_email:
          type: string
        carta_archivo:
          type: string
          format: uri
        observaciones:
          type: string
      required:
      - fecha_fin
      - fecha_inicio
      - provincia
      - referente_nombre
    ItinerarioPage:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Itinerario'
        estados:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
      required:
      - count
      - next
      - previous
      - results
    Jornada:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        id:
          type: integer
        itinerario_id:
          type: integer
        fecha:
          type: string
          format: date
        sede:
          type: string
        localidad:
          type: string
        ubicacion_url:
          type: string
        latitud:
          type: string
        longitud:
          type: string
        vehiculos:
          type: array
          items:
            type: string
        direccion:
          type: string
        estado:
          type: string
        estado_label:
          type: string
        referente:
          type: string
        referente_telefono:
          type: string
        equipo_asignado:
          type: string
        observaciones:
          type: string
        registros_total:
          type: integer
          nullable: true
        mapa_query:
          type: string
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/Checklist'
        registros:
          type: array
          items:
            $ref: '#/components/schemas/Registro'
        laboratorio:
          type: array
          items:
            $ref: '#/components/schemas/Laboratorio'
        cierre:
          allOf:
          - $ref: '#/components/schemas/Cierre'
          nullable: true
      required:
      - direccion
      - equipo_asignado
      - estado
      - estado_label
      - fecha
      - id
      - itinerario_id
      - latitud
      - localidad
      - longitud
      - observaciones
      - referente
      - referente_telefono
      - registros_total
      - sede
      - ubicacion_url
      - vehiculos
    JornadaHistoricalInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        fecha:
          type: string
          format: date
        sede:
          type: string
        localidad:
          type: integer
          nullable: true
        ubicacion_url:
          type: string
        direccion:
          type: string
        vehiculos:
          type: array
          items:
            type: integer
        horario_inicio:
          type: string
          format: time
          nullable: true
        horario_fin:
          type: string
          format: time
          nullable: true
        referente_dni:
          type: string
        referente_sexo:
          type: string
        referente_telefono:
          type: string
        observaciones:
          type: string
      required:
      - fecha
      - sede
      - ubicacion_url
    JornadaInput:
      type: object
      description: 'Contrato de salida: las escrituras usan los ModelForms compartidos.'
      properties:
        renaper_estado:
          type: string
        referente_nombre_renaper:
          type: string
        referente_apellido_renaper:
