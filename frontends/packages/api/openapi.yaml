                $ref: '#/components/schemas/EstadoLegajo'
          description: ''
  /api/celiaquia/expedientes/:
    get:
      operationId: expedientes_list
      description: Expedientes visibles para el usuario, con sus transiciones de estado.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
        description: Nombre exacto del estado.
      - in: query
        name: numero_expediente
        schema:
          type: string
        description: Coincidencia parcial.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - expedientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpedienteList'
          description: ''
    post:
      operationId: expedientes_create
      description: |-
        Alta del expediente, opcionalmente con su Excel masivo.

        El alta la hace la provincia: el expediente queda a nombre del usuario
        que lo crea y es lo que despues determina su alcance.
      tags:
      - expedientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpedienteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpedienteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpedienteCreate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expediente'
          description: ''
  /api/celiaquia/expedientes/{id}/:
    get:
      operationId: expedientes_retrieve
      description: Expedientes visibles para el usuario, con sus transiciones de estado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Expediente.
        required: true
      tags:
      - expedientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expediente'
          description: ''
    patch:
      operationId: expedientes_partial_update
      description: Edicion de metadatos. Solo mientras el expediente esta en CREADO.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Expediente.
        required: true
      tags:
      - expedientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExpedienteUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExpedienteUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpedienteUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expediente'
          description: ''
    delete:
      operationId: expedientes_destroy
      description: Baja del expediente. Reservada a coordinacion y admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Expediente.
        required: true
      tags:
      - expedientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/celiaquia/expedientes/{id}/asignaciones/:
