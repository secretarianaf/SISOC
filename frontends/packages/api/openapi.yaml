openapi: 3.0.3
info:
  title: SISOC API
  version: 1.0.0
  description: API de gestión de comedores, centros de familia y más
paths:
  /api/celiaquia/cupos/:
    get:
      operationId: cupos_list
      description: 'Cupos por provincia. Solo lectura: el alta la hace `CupoService`.'
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - cupos
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProvinciaCupoList'
          description: ''
  /api/celiaquia/cupos-movimientos/:
    get:
      operationId: cupos_movimientos_list
      description: Auditoria de movimientos de cupo.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - cupos-movimientos
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCupoMovimientoList'
          description: ''
  /api/celiaquia/cupos-movimientos/{id}/:
    get:
      operationId: cupos_movimientos_retrieve
      description: Auditoria de movimientos de cupo.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Movimiento de Cupo.
        required: true
      tags:
      - cupos-movimientos
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CupoMovimiento'
          description: ''
  /api/celiaquia/cupos/{id}/:
    get:
      operationId: cupos_retrieve
      description: 'Cupos por provincia. Solo lectura: el alta la hace `CupoService`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Cupo por Provincia.
        required: true
      tags:
      - cupos
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
