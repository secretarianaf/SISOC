      tags:
      - cupos
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLegajoList'
          description: ''
  /api/celiaquia/cupos/legajos/{legajo_id}/baja/:
    post:
      operationId: cupos_legajos_baja_create
      description: Libera definitivamente el cupo del titular.
      parameters:
      - in: path
        name: legajo_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - cupos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccionResultado'
          description: ''
  /api/celiaquia/cupos/legajos/{legajo_id}/reactivar/:
    post:
      operationId: cupos_legajos_reactivar_create
      description: Reactiva un titular suspendido.
      parameters:
      - in: path
        name: legajo_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - cupos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccionResultado'
          description: ''
  /api/celiaquia/cupos/legajos/{legajo_id}/suspender/:
    post:
      operationId: cupos_legajos_suspender_create
      description: Suspende al titular sin liberar el cupo.
      parameters:
      - in: path
        name: legajo_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - cupos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
