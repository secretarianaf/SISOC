      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/celiaquia/expedientes/{id}/fuera-de-cupo/:
