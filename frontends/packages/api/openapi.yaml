  /api/celiaquia/expedientes/{id}/importar/:
    post:
      operationId: expedientes_importar_create
      description: |-
        Importa los legajos del Excel masivo ya cargado en el expediente.

        La pantalla Django devuelve los totales por `messages`; aca se devuelven
        como JSON para que el front pueda mostrar validos, errores y
        advertencias sin parsear texto.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Expediente.
        required: true
      tags:
      - expedientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionResultado'
          description: ''
