[pytest]
# Tests y desarrollo corren la composicion completa (core + backends).
DJANGO_SETTINGS_MODULE = config.settings_all
# src/backends/ (config), el kernel y cada vertical se importan como `config`,
# `core`, `dispositivos`, etc. Al sumar un backend, agregarlo aca (ver
# src/backends/config/__init__.py). src/ contiene `scripts`; la raiz permite importar `docker`.
pythonpath = . src src/backends src/backends/kernel src/backends/sisoc_core src/backends/cdf src/backends/cdi src/backends/celiaquia src/backends/dispositivos src/backends/pas src/backends/vat src/backends/vpsl
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db
markers =
    smoke: quick smoke/integration checks
    mysql_compat: tests de compatibilidad ejecutados sobre MySQL real en CI
