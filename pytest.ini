[pytest]
# Tests y desarrollo corren la composicion completa (core + backends).
DJANGO_SETTINGS_MODULE = config.settings_all
# kernel/ y backends/<vertical>/ se importan como `core`, `dispositivos`, etc.
# Al sumar un backend, agregarlo aca (ver config/__init__.py).
pythonpath = . kernel backends/cdf backends/cdi backends/celiaquia backends/dispositivos backends/pas backends/vat backends/vpsl
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db
markers =
    smoke: quick smoke/integration checks
    mysql_compat: tests de compatibilidad ejecutados sobre MySQL real en CI
