<div class="mb-3">
    <label class="form-label{% if campo.field.required %} requiredField{% endif %}"
           for="{{ campo.id_for_label }}">
        {{ campo.label }}
        {% if campo.field.required %}<span class="asteriskField">*</span>{% endif %}
    </label>
    <div class="input-group">
        <span class="input-group-text">$</span>
        {{ campo }}
    </div>
    {% for error in campo.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
</div>
