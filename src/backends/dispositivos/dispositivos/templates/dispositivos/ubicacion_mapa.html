<section class="card mb-3" aria-label="Ubicación en el mapa">
    <div class="card-body">
        <h3 class="h5">Ubicación en el mapa</h3>
        {% if editable %}
            <button type="button"
                    id="dispositivo-mapa-buscar"
                    class="btn btn-secondary mb-2">Previsualizar ubicación</button>
            <p id="dispositivo-mapa-estado" class="text-muted" role="status">
                Se priorizan latitud y longitud. Si ambas están vacías, se busca por domicilio. La previsualización no guarda cambios.
            </p>
        {% endif %}
        <iframe id="dispositivo-mapa"
                title="Ubicación del dispositivo"
                width="100%"
                height="320"
                loading="lazy"
                allowfullscreen
                src="https://www.google.com/maps?q={% if mapa_query %}{{ mapa_query }}{% else %}Argentina{% endif %}&amp;output=embed"></iframe>
    </div>
</section>
