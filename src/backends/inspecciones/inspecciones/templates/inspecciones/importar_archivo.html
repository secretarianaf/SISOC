{% extends "inspecciones/base_panel.html" %}
{% block panel %}
    <section class="insp-dialogo" aria-labelledby="insp-importar-titulo">
        <div class="insp-dialogo-cabecera">
            <h2 id="insp-importar-titulo">{{ config.titulo }}</h2>
            <a class="insp-dialogo-cerrar" href="{% url config.volver %}" aria-label="Cerrar">×</a>
        </div>
        <form method="post"
              enctype="multipart/form-data"
              action="{% url url_subir %}"
              data-insp-procesando="Leyendo el archivo… puede tardar unos segundos.">
            {% csrf_token %}
            <div class="insp-dialogo-cuerpo">
                {% include "inspecciones/partials/pasos_importacion.html" with paso=1 %}
                {% include config.ayuda %}
                <div>
                    <label class="form-label" for="id_archivo">Archivo Excel (.xlsx) o CSV</label>
                    <input id="id_archivo"
                           class="form-control{% if form.archivo.errors %} is-invalid{% endif %}"
                           type="file"
                           name="archivo"
                           accept=".xlsx,.csv"
                           required />
                    {% for error in form.archivo.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
                </div>
            </div>
            <div class="insp-dialogo-pie">
                <div class="insp-acciones">
                    <a class="btn btn-link" href="{% url config.volver %}">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Revisar el archivo</button>
                </div>
            </div>
        </form>
    </section>
{% endblock %}
