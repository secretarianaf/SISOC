<p class="small text-muted">
    Columnas: <strong>fecha</strong> (AAAA-MM-DD o DD/MM/AAAA), <strong>cueanexo</strong>
    e <strong>inspector</strong> (usuario, DNI o mail). El inspector tiene que tener la sección
    Inspecciones escolares con rol Inspector. Una asignación repetida no se duplica; si la escuela
    ya tiene otro inspector ese día, se asigna igual y cuenta como otra visita.
