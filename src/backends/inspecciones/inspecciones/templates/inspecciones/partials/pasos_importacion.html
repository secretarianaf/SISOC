<ol class="insp-pasos" aria-label="Pasos">
    <li class="{% if paso > 1 %}hecho{% elif paso == 1 %}actual{% endif %}"
        {% if paso == 1 %}aria-current="step"{% endif %}>
        <span class="insp-paso-num">
            {% if paso > 1 %}
                ✓
            {% else %}
                1
            {% endif %}
        </span>
        Archivo
    </li>
    <li class="insp-paso-linea" aria-hidden="true"></li>
    <li class="{% if paso > 2 %}hecho{% elif paso == 2 %}actual{% endif %}"
        {% if paso == 2 %}aria-current="step"{% endif %}>
        <span class="insp-paso-num">
            {% if paso > 2 %}
                ✓
            {% else %}
                2
            {% endif %}
        </span>
        Revisión
    </li>
    <li class="insp-paso-linea" aria-hidden="true"></li>
    <li class="{% if paso == 3 %}actual{% endif %}"
        {% if paso == 3 %}aria-current="step"{% endif %}>
        <span class="insp-paso-num">3</span>
        Resultado
    </li>
</ol>
