{% load static %}
<aside class="app-sidebar shadow"{% if tema_lateral %} data-bs-theme="{{ tema_lateral }}"{% endif %}>
    {% if con_logo %}
        <div class="sidebar-brand">
            <a href="{% url 'inicio' %}" class="brand-link" aria-label="Inicio de SISOC">
                <img src="{% static 'custom/img/logoBlanco.png' %}" alt="SISOC" class="brand-image" />
            </a>
        </div>
    {% endif %}
    <div class="sidebar-wrapper">
        <nav>
            <ul class="nav sidebar-menu flex-column"
                data-lte-toggle="treeview"
                role="menu"
                data-accordion="false">
                {% include 'includes/sidebar/opciones.html' %}
                {% block menu-adicional %}{% endblock %}
            </ul>
        </nav>
    </div>
</aside>
