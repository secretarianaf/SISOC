components:
  schemas:
    InetAsistencia:
      type: object
      properties:
        sesion_id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date
          readOnly: true
        filas:
          type: array
          items:
            $ref: '#/components/schemas/InetAsistenciaRow'
      required:
      - fecha
      - filas
      - sesion_id
    InetAsistenciaRow:
      type: object
      properties:
        inscripcion_id:
          type: integer
        nombre:
          type: string
          readOnly: true
        documento:
          type: string
          readOnly: true
        presente:
          type: boolean
          nullable: true
        observaciones:
          type: string
      required:
      - documento
      - inscripcion_id
      - nombre
      - presente
    InetCiudadano:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        documento:
          type: string
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
      required:
      - apellido
      - documento
      - fecha_nacimiento
      - id
      - nombre
    InetCiudadanoPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/InetCiudadano'
      required:
      - count
      - next
      - previous
      - results
    InetDeleteGroup:
      type: object
      properties:
        modelo:
          type: string
        cantidad:
          type: integer
        modo:
          type: string
      required:
      - cantidad
      - modelo
      - modo
    InetDeletePreview:
      type: object
      properties:
        total_afectados:
          type: integer
        total_baja_logica:
          type: integer
        total_borrado_fisico:
          type: integer
        desglose_por_modelo:
          type: array
          items:
            $ref: '#/components/schemas/InetDeleteGroup'
      required:
      - desglose_por_modelo
      - total_afectados
      - total_baja_logica
      - total_borrado_fisico
    InetDetailField:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
      required:
      - label
      - value
    InetEstadoInput:
      type: object
      properties:
        estado:
          type: string
        observaciones:
          type: string
      required:
      - estado
    InetForm:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/InetFormField'
      required:
      - fields
    InetFormField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        kind:
